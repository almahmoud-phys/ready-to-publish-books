# Stage-0 evidence scaffold for a single book. Values start as UNKNOWN.
# `clear` is deliberately NOT a legal trademark_status value: agents only record
# `no_conflict_found`, then humans convert that to `clear` at sign-off.
collector_health: UNKNOWN          # CONFIRMED only if a control seed was mined this session
trend_direction: UNKNOWN           # rising | flat | declining
autocomplete_richness: UNKNOWN     # map of seed -> harvested keyword count
comps_under_50k_bsr: UNKNOWN      # integer
comp_table: UNKNOWN                # list of {title, asin, bsr, price, review_count, latest_review_date}
result_count_or_subniche: UNKNOWN
category_difficulty: UNKNOWN       # BSR of rank #20 in 2 target categories
gap_statement: UNKNOWN
differentiation_contract: UNKNOWN  # 3 promises, each citing a negative review
authority_fit: UNKNOWN             # y | n — from charter.authority_envelope
asset_feasibility: UNKNOWN
trademark_status: UNKNOWN          # no_conflict_found | conflict | uncertain
