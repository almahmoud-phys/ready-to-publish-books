# books/registry.yaml — the catalog ledger (LP6: catalog-level information flow).
# One entry per book. new-book.sh appends; publish-checklist updates on publish.
# This is the single glance-view of the whole catalog: stage, verdict, track, cost.

books:
# Empty = `books` parses as null, not []. Readers: use `books or []`.
# new-book.sh appends block entries below; do NOT restore `books: []` —
# a flow-style empty list cannot take appended block items (invalid YAML).
# entry schema:
# - slug: <kebab-case>
#   title: "<title>"
#   track: assisted | generated
#   stage: 0                # current pipeline stage (0–7)
#   verdict: null           # GO | PIVOT | KILL (stage 0)
#   created: <YYYY-MM-DD>
#   published: null         # or date
#   book_score: null        # floor score from stage 4
#   cost_usd: null
  - slug: llm-cost-routing-playbook
    title: "The LLM Cost & Routing Playbook"
    track: assisted
    stage: 0
    verdict: null
    created: 2026-08-08
    published: null
    book_score: null
    cost_usd: null
