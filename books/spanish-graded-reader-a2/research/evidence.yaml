# Stage-0 evidence scaffold for a single book. Values start as UNKNOWN.
# `clear` is deliberately NOT a legal trademark_status value: agents only record
# `no_conflict_found`, then humans convert that to `clear` at sign-off.
#
# Collected 2026-08-12 via an agent-operated browser on US Amazon. Everything not
# actually measured stays UNKNOWN. The owner said "GO"; that authorizes building the
# book, it does not convert an unmeasured field into a measured one. This file is what
# niche_verdict.py reads, so a courtesy value here would become indistinguishable from
# research at every later stage.

collector_health: CONFIRMED        # 2026-08-12, SECOND run of the day. The morning attempt called the
                                   # raw completion endpoint directly and the `historical fiction`
                                   # control returned 7 vs a known-healthy ~27 — DEGRADED. Re-running
                                   # through the project wrapper `tooling/scripts/niche_mine.sh`
                                   # returned a full harvest (ledger += 67 rows on the control).
                                   # The morning degradation was the endpoint call, not Amazon
                                   # blocking us. Use the wrapper; ADR-009 P24 says so.

trend_direction: rising            # trendspyg via .kdp-research/kdp-scout/.venv, US, `today 5-y`,
                                   # 2026-08-12, partial weeks excluded (261 complete weekly points).
                                   # Averages over the first and last 52 complete weeks:
                                   #   `learn spanish`          34.54 -> 51.85  = +50%
                                   #   `spanish short stories`  30.17 -> 56.27  = +86%
                                   # Both rising well past the +/-10% flat band. For contrast, the
                                   # `SQL` family measured -25% in the run that retired it.
                                   # Caveat: Trends measures general search attention, not book
                                   # purchases. It corroborates the BSR and category evidence here;
                                   # it does not independently prove demand.
                                   # Method note: the first call failed with DownloadError
                                   # ("rate-limited on replay"). One retry after ~45s succeeded.
                                   # trendspyg returns a plain list of dicts, not an envelope object.

autocomplete_richness:             # via tooling/scripts/niche_mine.sh, marketplace us, 2026-08-12,
                                   # under a CONFIRMED control. Ledger row counts, not curated:
  learn spanish: 23
  spanish short stories for beginners: 7
  spanish reading: 15
  spanish for beginners: 9
  spanish stories: 8
  learn spanish books: 1
                                   # RAW harvest counts, 63 rows total. Read them with the
                                   # pollution in view rather than as 63 points of buyer intent:
                                   #   `spanish reading` (15) is mostly CLASSROOM/KIDS SUPPLIES —
                                   #     reading rods, manipulatives, kindergarten, toddler, decor,
                                   #     reading pen, stations, cards. Only 2 rows
                                   #     (`spanish reading for beginners`,
                                   #     `spanish reading and comprehension`) address our reader.
                                   #     Same semantic-pollution shape that got Obsidian and Notion
                                   #     rejected earlier in docs/discovery-log.md.
                                   #   `spanish for beginners` (9) is half author/title navigation
                                   #     (angela wilkes, duff, juan fernandez) plus kids/teens/high
                                   #     school. On-target: adult, kindle, workbook.
                                   #   `learn spanish books` (1) collapsed to a kids row. Thin.
                                   # ON-TARGET SUBSET, counted honestly: ~12 of 63 rows describe an
                                   # ADULT self-study reader. The two that matter most:
                                   #   `spanish stories with english translation` — parallel text is
                                   #     demanded buyer language, not our design preference.
                                   #   `spanish stories a2` / `spanish stories for intermediate` —
                                   #     buyer language for volumes 2-3. The series ladder now has
                                   #     evidence instead of being an assumption.
                                   # `spanish stories` (7 of 8 on-target) is the CLEAN seed for this
                                   # reader and should drive titling, not `spanish reading`.
                                   # Counts are cumulative ledger rows in
                                   # research/niche-ledger.csv (book-local, committed), NOT the
                                   # wrapper's per-run "ledger += N" delta. I claimed the delta
                                   # first and niche_verdict.py caught it — recorded because the
                                   # same mistake would silently inflate every future book.
                                   # The `historical fiction` control is deliberately absent: it is
                                   # a collector-health probe, not a candidate seed, and it belongs
                                   # in collector_health above.
                                   # Reading: the parent `learn spanish` carries a real buyer-language
                                   # cluster. The exact long-tail phrase is thin at 7 — a
                                   # title-navigation signal, the same shape that retired the SQL and
                                   # Playwright candidates. It does NOT sink this book, because the
                                   # demand case here rests on verified BSR and category rank rather
                                   # than on autocomplete breadth; but the final title must not bet on
                                   # that long-tail phrase carrying traffic by itself.

