    the phrasebook category is a phrasebook shelf, not a reader shelf — codex flagged that
    ranking there does not prove reader-format demand."

gap_statement: "On this shelf the teaching method is not the problem — reviewers praise the
  scaffolding. The prose is the problem. The category's trade incumbent is criticised by three of
  four collected reviewers for stories that are dull, silly and childish, written by someone who is
  a language teacher rather than a writer; by a fourth for peninsular Spanish sold to a US audience
  whose real exposure is Latin American; and for uncaught errors in a product whose only value is
  being correct. The gap is a graded reader an adult is not embarrassed to read, in one declared
  Latin American locale, with correctness that is mechanically proven rather than asserted."

differentiation_contract:          # 3 promises, each traceable to a dated review in reviews.md.
                                   # None is a phrase we invented and then validated against its
                                   # own plausibility.
  - promise: "Stories written for adults: no talking animals, no children's-primer register, and
      no textbook framing. Every story has an actual narrative reason to turn the page."
    cites: "Ramona Mead 2019-10-19 ('silly... out of a kid's early reader... feels like a text
      book. I was looking for a more casual read'); Mikael 2021-10-05 ('painfully obvious that the
      author is not a writer. The stories are dull and lack imagination'); soph 2019-08-01
      ('awful and a little ridiculous in places')."
    how_verified: "Editorial, not mechanical. This is the one promise the check suite cannot prove;
      it is judged at stage 3/4 against the rubric. Recorded as such rather than dressed up."
  - promise: "One declared Latin American locale on the cover and enforced throughout — no
      peninsular/Latin American mixing anywhere in the book."
    cites: "Shawn 2019-08-05 ('el problema es las historias fueran escriben en espanol de Espana.
      En el Estados Unidos mas los hispanicos de Mexico o Centro America')."
    how_verified: "MECHANICAL — tooling/scripts/graded_reader_check.py locale_violations(), already
      built and self-checked. Fails the build on a single vosotros/vuestro."
  - promise: "Every Spanish sentence passes a published, reproducible check before it ships:
      controlled-vocabulary coverage against a cited A1 wordlist, plus morphology and agreement."
    cites: "soph 2019-08-01 ('there were also a couple of errors in there which won't really help
      your learning')."
    how_verified: "MECHANICAL — coverage() is built and self-checked; the morphology analyzer is
      NOT yet built and is listed as an open task. This promise is not fully honoured today."

authority_fit: y                   # charter.authority_envelope is generated-track and
                                   # machine-verified; it claims no fluency, credential, or lived
                                   # experience, so nothing in the envelope is unearned. NOTE: the
                                   # charter is DRAFTED, NOT ATTESTED until owner_attested is filled.

asset_feasibility: "Text-only interior; no photography, no screenshots, no hardware, no field
  testing. Verification is fully computational (wordlist coverage, morphology, locale consistency,
  sentence-aligned translation checks). Cover is AI-images per ADR-005. Flagged risks: several
  comps ship an audio download, which we do not have and must not imply; and the check suite is
  real engineering work that must exist before drafting, not after."

