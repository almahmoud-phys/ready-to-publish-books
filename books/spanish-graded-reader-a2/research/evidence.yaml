  reading: "Both target categories are WINNABLE. A top-20 slot costs roughly #117k overall in the
    primary category and #191k in the secondary. Our two verified comps sit at #10,839 and #21,564 —
    an order of magnitude better than the rank-20 bar, which means the visible top of these
    categories is genuinely contested by books at our achievable level, not walled off."
