result_count_or_subniche: 431      # Kindle result count for `spanish stories a1`, the book's PRIMARY
                                   # positioning query, measured 2026-08-12. LOW band (<1,000).
                                   #
                                   # Why this number and not the head term. `spanish short stories
                                   # for beginners` reports "1,000" — that is Amazon's DISPLAY CAP,
                                   # not a count; the true head-term figure is unobtainable and sits
                                   # somewhere in the contested band. Reporting a capped ceiling as
                                   # if it were a measurement would be the same class of error as
                                   # the delta-vs-cumulative mistake caught earlier in this file.
                                   #
                                   # The sub-niche is measured and genuinely low, across five
                                   # uncapped queries (Kindle, US, 2026-08-12):
                                   #   spanish a1 reader                   302
                                   #   spanish stories a1                  431  <- this field
                                   #   spanish stories a2                  499  (volume 2 ladder)
                                   #   spanish graded reader               661
                                   #   spanish stories for adult beginners 834
                                   # Every one is under the repo's 1,000 low-competition threshold.
                                   #
                                   # Shelf composition at the head term remains as recorded earlier:
                                   # indie/pen-name dominated, 4.3-4.8, heavy Kindle Unlimited, one
                                   # trade incumbent at organic #4, no A-list wall.
                                   #
                                   # Honest reading: we do NOT enter at the head term. We enter at
