<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Typographic series-system cover concept</title>
  <desc id="desc">Deep navy cover with oversized A2 and Spanish graded reader typography, an amber postal ring, a horizon line, and the candidate title.</desc>
  <rect width="1600" height="2560" fill="#0C2033"/>
  <circle cx="1290" cy="370" r="330" fill="none" stroke="#D9933D" stroke-width="42" opacity="0.72"/>
  <circle cx="1290" cy="370" r="250" fill="none" stroke="#D9933D" stroke-width="12" stroke-dasharray="26 18" opacity="0.72"/>
  <text x="100" y="420" font-family="Arial, Helvetica, sans-serif" font-size="430" font-weight="900" fill="#F1E7D2">A2</text>
  <text x="102" y="790" font-family="Arial, Helvetica, sans-serif" font-size="240" font-weight="900" letter-spacing="-6" fill="#D9933D">SPANISH</text>
  <text x="110" y="955" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="700" letter-spacing="14" fill="#F1E7D2">GRADED READER</text>
  <line x1="110" y1="1100" x2="1490" y2="1100" stroke="#F1E7D2" stroke-width="8" opacity="0.45"/>
  <text x="110" y="1430" font-family="Georgia, Times New Roman, serif" font-size="150" font-weight="700" fill="#F1E7D2">THE LETTER</text>
  <text x="110" y="1600" font-family="Georgia, Times New Roman, serif" font-size="112" font-style="italic" fill="#A9C7C6">at Puerto Lento</text>
  <path d="M110 1940 C420 1880 720 2000 1020 1930 C1210 1886 1370 1890 1490 1920" fill="none" stroke="#A9C7C6" stroke-width="12"/>
  <circle cx="1250" cy="1898" r="32" fill="#F4B44B"/>
  <path d="M1225 1960 L1275 1960 L1325 2140 L1175 2140 Z" fill="#F4B44B" opacity="0.18"/>
  <text x="110" y="2240" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="2" fill="#F1E7D2">10 LINKED SPANISH STORIES FOR ADULT LEARNERS</text>
  <text x="110" y="2305" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="2" fill="#F1E7D2">(A2 GRADED READER)</text>
  <text x="110" y="2390" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#D9933D">LATIN-AMERICAN SPANISH CONVENTION</text>
  <text x="110" y="2480" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="5" fill="#79979A">STAGE-6 CANDIDATE · NOT FINAL ART</text>
</svg>
